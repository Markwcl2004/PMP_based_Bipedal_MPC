# MLP状态估计器配置文件

# 网络结构
input_dim: 18          # 输入维度: state(12) + control(6)
output_dim: 12         # 输出维度: next_state(12)
hidden_dims: [128, 64, 32]  # 隐藏层维度
activation: "relu"     # 激活函数: relu/tanh/sigmoid/linear

# 归一化参数
normalization:
  use_input_norm: true
  use_output_norm: true

  # 输入归一化 (state + control)
  input_mean: [0.0, 0.0, 0.5,  # 位置 (x, y, z)
               0.0, 0.0, 0.0,  # 速度 (vx, vy, vz)
               0.0, -0.1, -0.3,  # 左足位置 (fx, fy, fz)
               0.0, 0.1, -0.3,   # 右足位置 (fx, fy, fz)
               0.0, 0.0, 50.0,   # 左足力 (fx, fy, fz)
               0.0, 0.0, 50.0]   # 右足力 (fx, fy, fz)

  input_std: [0.2, 0.2, 0.1,    # 位置标准差
              0.5, 0.5, 0.3,    # 速度标准差
              0.15, 0.1, 0.05,  # 左足位置标准差
              0.15, 0.1, 0.05,  # 右足位置标准差
              30.0, 30.0, 50.0, # 左足力标准差
              30.0, 30.0, 50.0] # 右足力标准差

  # 输出归一化 (next_state)
  output_mean: [0.0, 0.0, 0.5,  # 位置 (x, y, z)
                0.0, 0.0, 0.0,  # 速度 (vx, vy, vz)
                0.0, -0.1, -0.3,  # 左足位置
                0.0, 0.1, -0.3]   # 右足位置

  output_std: [0.2, 0.2, 0.1,   # 位置标准差
               0.5, 0.5, 0.3,   # 速度标准差
               0.15, 0.1, 0.05, # 左足位置标准差
               0.15, 0.1, 0.05] # 右足位置标准差

# 模型文件路径
model_path: "/path/to/mlp_model.txt"

# 训练参数 (仅用于Python训练脚本)
training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 100
  optimizer: "adam"
  weight_decay: 1e-5
  dropout: 0.2
